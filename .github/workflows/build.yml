name: build

# 每次推到 main / 每个 PR：先把"能不能编译"和"自检是否还能过"守住。
# 真正发版（出单文件 + 建 Release）在 release.yml，由 tag 触发。
# v1.5.8.2 起只有一个形态：Windows 10 1809+ / Windows 11，x64。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建（Windows 10 1809+ / 11，x64）
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 安装 Rust 工具链（原生索引内核）
        uses: dtolnay/rust-toolchain@stable

      - name: 编原生索引内核（ipidx.dll）
        run: cargo build --release
        working-directory: src/ipidx

      - name: 原生层自测
        run: cargo test
        working-directory: src/ipidx

      - name: 还原
        run: dotnet restore src/InputPlus/InputPlus.csproj

      - name: 构建
        run: >
          dotnet build src/InputPlus/InputPlus.csproj
          -c Release
          -p:RuntimeIdentifier=win-x64 -v:minimal

  selftest:
    name: 自检（发布产物）
    runs-on: windows-latest
    needs: build
    # ⚠ 提醒性检查：CI 里没有真实桌面，个别用例会因环境限制跳过或失败
    # （钩子注入、剪贴板、焦点相关）。这里只看"能不能跑完并产出日志"，
    # 红了先看 selftest.log，不直接拦合并。
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 安装 Rust 工具链（原生索引内核）
        uses: dtolnay/rust-toolchain@stable

      - name: 编原生索引内核（ipidx.dll）
        run: cargo build --release
        working-directory: src/ipidx

      - name: 发布单文件（win11-x64）
        run: >
          dotnet publish src/InputPlus/InputPlus.csproj
          -c Release -f net10.0-windows -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o dist/ci

      - name: 运行 --selftest
        shell: pwsh
        run: |
          $env:INPUTPLUS_DATA = Join-Path $env:RUNNER_TEMP 'ke-data'
          New-Item -ItemType Directory -Path $env:INPUTPLUS_DATA -Force | Out-Null
          & .\dist\ci\InputPlus.exe --selftest --noelevate
          $code = $LASTEXITCODE
          $log = Join-Path $env:INPUTPLUS_DATA 'selftest.log'
          if (Test-Path $log) {
            Get-Content $log -Tail 40 | Write-Host
            Copy-Item $log (Join-Path $env:RUNNER_TEMP 'selftest.log') -Force
          }
          exit $code

      - name: 上传自检日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: ${{ runner.temp }}/selftest.log
          if-no-files-found: warn
